# ~/.config/tmux/tmux.conf
# Portable entry point for the tmux configuration.

source-file ~/.config/tmux/conf/10-options.conf
source-file ~/.config/tmux/conf/20-keybindings.conf
source-file ~/.config/tmux/conf/30-status.conf

# Keep operating-system-specific behavior separate from the portable core.
if-shell '[ "$(uname -s)" = "Darwin" ]' 'source-file ~/.config/tmux/conf/40-platform-macos.conf'

# Optional private work overlay. Same layering as zsh/init.zsh: the file exists
# only on a machine that has the private overlay repository checked out.
if-shell '[ -f "$HOME/configs/work-dotfiles/tmux/work.conf" ]' 'source-file ~/configs/work-dotfiles/tmux/work.conf'

# Optional machine-local overrides. Loaded last so it can override anything
# above. Never shared between machines.
if-shell '[ -f "$HOME/configs/local/tmux/local.conf" ]' 'source-file ~/configs/local/tmux/local.conf'
