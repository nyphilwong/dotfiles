# ~/.config/tmux/tmux.conf
# Portable entry point for the tmux configuration.

source-file ~/.config/tmux/conf/10-options.conf
source-file ~/.config/tmux/conf/20-keybindings.conf
source-file ~/.config/tmux/conf/30-status.conf

# Keep operating-system-specific behavior separate from the portable core.
if-shell '[ "$(uname -s)" = "Darwin" ]' 'source-file ~/.config/tmux/conf/40-platform-macos.conf'

# Optional work-specific settings. Keep company/project behavior separate from
# the portable personal configuration.
if-shell '[ -f "$HOME/.config/tmux/conf/90-work.conf" ]' 'source-file ~/.config/tmux/conf/90-work.conf'

# Optional machine-specific settings. Do not copy this file to another machine
# unless those settings are intended there.
if-shell '[ -f "$HOME/.config/tmux/conf/99-local.conf" ]' 'source-file ~/.config/tmux/conf/99-local.conf'
