# General tmux behavior

# Use Ctrl-a as the tmux prefix instead of the default Ctrl-b.
unbind C-b
set -g prefix C-a
set -g prefix2 None

# Capture mouse scrolling, pane resizing, and text selection.
set -g mouse on

# Start window and pane numbering at 1 instead of 0 — 1 sits next to the rest
# of the number row, 0 is a stretch. renumber-windows (below) keeps numbering
# gap-free as windows are closed.
set -g base-index 1
setw -g pane-base-index 1

# Keep more scrollback available for long Pi/Claude/Codex conversations.
set -g history-limit 10000

# Make new windows and panes start in the current pane's directory.
bind-key c new-window -c '#{pane_current_path}'
bind-key C new-window -c '#{pane_current_path}'

# Use vi-style navigation in tmux copy mode.
set -g mode-keys vi

# Allow applications such as Pi to receive Shift/Ctrl/Alt-modified keys.
# tmux 3.5+ supports CSI-u, which Pi recommends. Guarded because tmux 3.4
# (still current on Ubuntu 24.04) doesn't know this option.
set -s extended-keys on
if-shell -b '[ "$(tmux -V | cut -d" " -f2)" \>= "3.5" ]' \
  'set -s extended-keys-format csi-u'

# Make escape-sequence handling responsive while retaining normal Alt-key use.
set -sg escape-time 10

# Renumber windows after one is closed.
set -g renumber-windows on

# Let terminal applications manage the clipboard through tmux's clipboard
# integration; macOS copy-mode bindings also explicitly use pbcopy.
set -s set-clipboard external
