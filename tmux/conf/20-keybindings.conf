# Prefix and navigation key bindings

# Press the prefix twice to send Ctrl-a to the application in the pane.
bind-key C-a send-prefix

# Reload this configuration without restarting the tmux server.
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux configuration reloaded'

# Intuitive split keys. In tmux terminology, - is a horizontal divider and |
# is a vertical divider.
unbind-key '"'
unbind-key %
bind-key | split-window -h -c '#{pane_current_path}'
bind-key - split-window -v -c '#{pane_current_path}'

# Vim-like pane navigation.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Vim-like pane resizing. These repeat while the prefix is held.
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Convenient pane/window actions.
bind-key z resize-pane -Z
bind-key x confirm-before 'kill-pane'
bind-key q display-panes
bind-key s choose-tree -Zs
bind-key w choose-tree -Zw

# Enter copy mode explicitly when keyboard scrolling is needed.
bind-key [ copy-mode
