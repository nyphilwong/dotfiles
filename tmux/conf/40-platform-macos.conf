# macOS-specific behavior

# Copy selected text to the macOS system clipboard rather than only to a
# tmux paste buffer. This also makes the default mouse-drag release behavior
# use pbcopy.
set -g copy-command 'pbcopy'

# Selection is made in the pane where the drag starts.
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'
