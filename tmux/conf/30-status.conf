# Minimal, modern status bar

set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=#1f2335,fg=#a9b1d6'
set -g status-left-length 40
set -g status-right-length 80

# Show the session name on the left and a compact clock on the right.
set -g status-left '#[fg=#7aa2f7,bold] #S #[fg=#565f89]│'
set -g status-right '#[fg=#565f89]│ #[fg=#a9b1d6]%H:%M '

# Keep window labels quiet; make the active window clear.
set -g window-status-format '#[fg=#565f89] #I:#W '
set -g window-status-current-format '#[fg=#bb9af7,bold] #I:#W '
set -g window-status-separator ''

# Make the active pane border visible without being distracting.
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#7aa2f7'
